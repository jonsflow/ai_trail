<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trail Admin — states and cards</title>
<style>
:root{
  --bg:#12100e; --panel:#1a1714; --edge:#332d25; --ink:#ece4d7; --dim:#a2968a;
  --faint:#7d7268; --amber:#e0a44e; --good:#3ddc97; --bad:#ff8f6b; --warn:#ffd166;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans)}
header{position:sticky;top:0;z-index:10;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:10px 20px;display:flex;gap:12px;
  align-items:center;flex-wrap:wrap}
h1{font-size:13px;margin:0;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.spacer{flex:1}
input,button,select{font:inherit;background:#241f1b;color:var(--ink);
  border:1px solid var(--edge);border-radius:6px;padding:5px 10px;cursor:pointer}
input{cursor:text}
button:hover,a.btn:hover{border-color:var(--amber);color:var(--amber)}
a.btn{text-decoration:none;background:#241f1b;color:var(--ink);border:1px solid var(--edge);
  border-radius:6px;padding:5px 10px}
main{max-width:1180px;margin:0 auto;padding:20px 20px 120px}
.bar{font-size:12px;color:var(--dim);padding:6px 20px;background:#191614;
  border-bottom:1px solid var(--edge)}
#jump{position:sticky;top:47px;z-index:9;display:flex;gap:6px;flex-wrap:wrap;
  padding:9px 20px;background:var(--panel);border-bottom:1px solid var(--edge)}
#jump a{text-decoration:none;color:var(--dim);font-size:12px;border:1px solid var(--edge);
  border-radius:14px;padding:3px 11px;white-space:nowrap}
#jump a:hover{border-color:var(--amber);color:var(--amber)}
#jump a i{font-style:normal;color:var(--faint);margin-left:6px;font-size:10.5px}
#jump a.off{opacity:.35}
h2{scroll-margin-top:96px}
h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  border-bottom:1px solid var(--edge);padding-bottom:6px;margin:34px 0 14px}
h2 span{color:var(--amber);margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--edge);
  border-radius:8px;padding:12px 14px}
.card.good{border-left-color:var(--good)}
.card.bad{border-left-color:var(--bad)}
.card.rule{border-left-color:var(--amber)}
.card h3{margin:0 0 6px;font-size:14px;line-height:1.35}
.card p{margin:0 0 8px;color:var(--dim);font-size:13px;line-height:1.55}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--faint);line-height:1.7;
  border-top:1px dashed var(--edge);padding-top:7px;white-space:pre-wrap}
.meta b{color:var(--ink);font-weight:600}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
th{text-align:left;font-family:var(--sans);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);padding:6px 10px;border-bottom:1px solid var(--edge)}
td{padding:7px 10px;border-bottom:1px solid #241f1b;vertical-align:top}
td.n{color:var(--amber);white-space:nowrap}
td.cond{color:var(--good)}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 7px;
  border:1px solid var(--edge);border-radius:10px;color:var(--dim);margin:0 4px 4px 0}
.nothing{color:var(--faint);padding:30px 0}
</style></head>
<body>
<header>
  <h1>Trail admin</h1>
  <input id="q" placeholder="filter cards…" style="width:220px">
  <span class="spacer"></span>
  <a class="btn" href="/play" target="_blank">play ↗</a>
  <a class="btn" href="/">the paper ↗</a>
  <button id="reload">reload</button>
</header>
<div class="bar" id="bar">loading…</div>
<nav id="jump"></nav>
<main id="main"></main>

<script>
const $ = s => document.querySelector(s);
const esc = t => (t||'').replace(/[&<>]/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));
let DATA = null;

/* the order the game actually uses them in, not alphabetical */
const GROUPS = [
  {id:'rules',     label:'Pillars — the win test',       short:'Pillars',    cls:'rule'},
  {id:'losses',    label:'Loss conditions',              short:'Losses',     cls:'bad', table:true},
  {id:'endings',   label:'Endings',                      short:'Endings',    cls:'rule'},
  {id:'dividends', label:'Dividends — earned good news', short:'Dividends',  cls:'good'},
  {id:'margin',    label:'Margin call',                  short:'Margin call',cls:'bad'},
  {id:'landmarks', label:'Landmarks (compute gates)',    short:'Landmarks',  cls:'rule'},
  {id:'paces',     label:'Pace options (every leg)',     short:'Paces',      cls:''},
  {id:'invest',    label:'Money options (rotating)',     short:'Money',      cls:''},
  {id:'events',    label:'Event deck (no repeats)',      short:'Events',     cls:''},
  {id:'pace',      label:'Leg framings',                 short:'Framings',   cls:''}
];

function card(s, cls){
  return '<div class="card ' + cls + '">' +
    '<h3>' + esc(s.title) + '</h3>' +
    (s.body ? '<p>' + esc(s.body) + '</p>' : '') +
    (s.detail && s.detail.length
      ? '<div class="meta">' + s.detail.map(d => {
          const i = d.indexOf(':');
          return i > 0 && i < 22
            ? '<b>' + esc(d.slice(0, i)) + '</b>' + esc(d.slice(i))
            : esc(d);
        }).join('\n') + '</div>'
      : '') +
    '<div style="margin-top:7px"><span class="pill">' + esc(s.key) + '</span></div>' +
    '</div>';
}

function lossTable(rows){
  return '<table><thead><tr><th>Ending</th><th>Fires when</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td class="n">' + esc(r.title) + '</td>' +
                  '<td class="cond">' + esc(r.body) + '</td></tr>').join('') +
    '</tbody></table>';
}

function render(){
  const q = $('#q').value.trim().toLowerCase();
  let shown = 0, total = 0;
  $('#main').innerHTML = GROUPS.map(g => {
    const all = DATA[g.id] || [];
    total += all.length;
    const rows = all.filter(s => !q ||
      (s.title + ' ' + s.body + ' ' + (s.detail||[]).join(' ')).toLowerCase().includes(q));
    shown += rows.length;
    if(!rows.length) return '';
    return '<h2 id="g-' + g.id + '">' + esc(g.label) + '<span>' + rows.length +
           (rows.length !== all.length ? ' of ' + all.length : '') + '</span></h2>' +
           (g.table ? lossTable(rows)
                    : '<div class="grid">' + rows.map(s => card(s, g.cls)).join('') + '</div>');
  }).join('') || '<p class="nothing">Nothing matches that filter.</p>';

  $('#jump').innerHTML = GROUPS.map(g => {
    const all = DATA[g.id] || [];
    const n = all.filter(x => !q ||
      (x.title + ' ' + x.body + ' ' + (x.detail||[]).join(' ')).toLowerCase().includes(q)).length;
    return '<a href="#g-' + g.id + '"' + (n ? '' : ' class="off"') + '>' +
           esc(g.short) + '<i>' + n + '</i></a>';
  }).join('');

  $('#bar').textContent = shown + ' of ' + total +
    ' cards · read live from aitrail.html via tools/extract_sections.js';
}

async function load(){
  const r = await fetch('/api/game');
  DATA = await r.json();
  if(DATA.error){ $('#bar').textContent = 'extractor failed: ' + DATA.error; return; }
  render();
}
/* ?q= makes a filtered view linkable, which is how you hand someone
   "look at the arrears" without describing where to scroll. */
const qp = new URLSearchParams(location.search).get('q');
if(qp) $('#q').value = qp;
$('#q').addEventListener('input', () => {
  const u = new URL(location); const v = $('#q').value.trim();
  v ? u.searchParams.set('q', v) : u.searchParams.delete('q');
  history.replaceState(null, '', u);
  render();
});
$('#reload').addEventListener('click', load);
load();
</script>
</body></html>
